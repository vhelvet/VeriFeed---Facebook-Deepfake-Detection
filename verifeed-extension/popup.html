<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriFeed - Deepfake Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: url('VeriFeed-Background.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            padding: 0;
        }

        .container {
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .logo-img {
            width: auto;
            height: 32px;
            object-fit: contain;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .close-btn, .refresh-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .close-btn:hover, .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .logo-text {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #ffffff, #3b82f6, #8b5cf6, #ec4899, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .status-title {
            font-weight: 600;
            font-size: 14px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.online {
            background: #28a745;
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.6);
        }

        .status-dot.offline {
            background: #dc3545;
            box-shadow: 0 0 8px rgba(220, 53, 69, 0.6);
        }

        .status-info {
            font-size: 12px;
            opacity: 0.9;
            line-height: 1.4;
        }

        .settings-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .settings-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
        }

        .setting-label {
            font-size: 13px;
            flex: 1;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.3);
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #28a745;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 11px;
            opacity: 0.7;
        }

        .footer-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 5px;
            color: white;
            text-decoration: none;
            font-size: 12px;
            transition: opacity 0.3s;
        }

        .footer-link:hover {
            opacity: 0.8;
        }

        .gmail-icon {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .website-icon {
            color: white;
            font-size: 14px;
            font-weight: bold;
            filter: brightness(0) invert(1);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="VeriFeed-Logo.png" alt="VeriFeed Logo" class="logo-img">
            <div class="header-right">
                <button class="refresh-btn" id="btnRefresh" title="Refresh">↻</button>
                <button class="close-btn" id="btnClose" title="Close">×</button>
            </div>
        </div>
        <div class="logo-text">VeriFeed</div>
        <div class="subtitle">AI-Powered Deepfake Detection</div>

        <div class="status-card">
            <div class="status-header">
                <div class="status-title">Server Status</div>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Checking...</span>
                </div>
            </div>
            <div class="status-info" id="statusInfo">
                Connecting to analysis server...
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-title">Detection Settings</div>

            <div class="setting-item">
                <span class="setting-label">Enable VeriFeed</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggleEnabled" checked>
                    <span class="slider"></span>
                </label>
            </div>


        </div>

        <div class="footer">
            <div class="footer-links">
                <a href="mailto:verifeedofficial@gmail.com" class="footer-link">
                    <span class="gmail-icon">✉</span>
                    verifeedofficial@gmail.com
                </a>
                <a href="http://localhost:5173/" target="_blank" class="footer-link">
                    <span class="website-icon">🌐</span>
                    VeriFeed Official Website
                </a>
            </div>
            VeriFeed v1.0.0 • Powered by AI
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
